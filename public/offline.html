<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>juyo — No connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #ffffff;
    }
    body {
      font-family: sans-serif;
      color: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .wifi-icon { margin-bottom: 20px; }
    .lang-switcher {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    .lang-btn {
      background: transparent;
      border: 2px solid transparent;
      padding: 4px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .lang-btn.active {
      border-color: #09090b;
    }
    .lang-btn img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .lang-btn span {
      font-size: 11px;
      color: #71717a;
      font-weight: 500;
    }
    .lang-btn.active span {
      color: #09090b;
      font-weight: 700;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #09090b; }
    p { font-size: 14px; color: #71717a; margin-bottom: 28px; line-height: 1.7; }
    .retry-btn {
      background: #09090b;
      color: #fff;
      border: none;
      padding: 13px 32px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    .text-content { display: none; }
    .text-content.active { display: block; }
  </style>
</head>
<body>
  <div class="wifi-icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <circle cx="12" cy="20" r="1" fill="#ef4444"/>
    </svg>
  </div>

  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="tg" onclick="setLang('tg')">
      <img src="/flags/flag-tj.jpg" alt="TJ" />
      <span>TJ</span>
    </button>
    <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">
      <img src="/flags/flag-ru.webp" alt="RU" />
      <span>RU</span>
    </button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">
      <img src="/flags/flag-en.jpg" alt="EN" />
      <span>EN</span>
    </button>
  </div>

  <div id="tg" class="text-content active">
    <h1>Пайвастшавӣ нест</h1>
    <p>Интернетро санҷед ва дубора кӯшиш кунед.</p>
    <button class="retry-btn" onclick="retry()">Дубора кӯшиш</button>
  </div>

  <div id="ru" class="text-content">
    <h1>Нет подключения</h1>
    <p>Проверьте интернет и попробуйте снова.</p>
    <button class="retry-btn" onclick="retry()">Попробовать снова</button>
  </div>

  <div id="en" class="text-content">
    <h1>No internet connection</h1>
    <p>Check your connection and try again.</p>
    <button class="retry-btn" onclick="retry()">Try again</button>
  </div>

  <script>
    function setLang(lang) {
      document.querySelectorAll('.text-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.lang-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(lang).classList.add('active');
      document.querySelector('[data-lang="' + lang + '"]').classList.add('active');
    }
    function retry() {
      window.location.href = '/';
    }
  </script>
</body>
</html>
